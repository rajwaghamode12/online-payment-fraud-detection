{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Transaction Analysis Form</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('check_transaction') }}">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Transaction Amount (₹)</label>
                            <input type="number" step="0.01" name="amount" class="form-control" required value="5000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Transaction Type</label>
                            <select name="transaction_type" class="form-select" required>
                                <option value="UPI">UPI</option>
                                <option value="Credit Card">Credit Card</option>
                                <option value="Debit Card">Debit Card</option>
                                <option value="Net Banking">Net Banking</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Transaction Time (Hour of day 0-23)</label>
                            <input type="number" min="0" max="23" name="transaction_time" class="form-control" required value="14">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sender Account Balance (₹)</label>
                            <input type="number" step="0.01" name="sender_balance" class="form-control" required value="20000">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Receiver Account Balance (₹)</label>
                            <input type="number" step="0.01" name="receiver_balance" class="form-control" required value="5000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <select name="location" class="form-select" required>
                                <option value="Same City">Same City</option>
                                <option value="Different City">Different City</option>
                                <option value="Different Country">Different Country</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Device Type</label>
                            <select name="device_type" class="form-select" required>
                                <option value="Mobile">Mobile</option>
                                <option value="Desktop">Desktop</option>
                                <option value="Tablet">Tablet</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Number of Previous Transactions</label>
                            <input type="number" name="previous_transactions" class="form-control" required value="50">
                        </div>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Is this a new device?</label>
                            <select name="new_device" class="form-select" required>
                                <option value="0">No (Known Device)</option>
                                <option value="1">Yes (New Device)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Is the location unusual?</label>
                            <select name="unusual_location" class="form-select" required>
                                <option value="0">No (Normal)</option>
                                <option value="1">Yes (Unusual)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">CHECK TRANSACTION</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
